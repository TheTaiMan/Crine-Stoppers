<div class="banner">
  <div class="banner-container">
    <!-- Logo Section -->
    <div class="banner-logo-section">
      <div class="banner-logo-container">
        <img class="banner-logo" alt="Crime Stoppers Logo" src="assets/icons/logo.png">
      </div>
    </div>
    
    <!-- Content Section -->
    <div class="banner-content-section">
      <div class="banner-content-container">
        <!-- Title -->
        <div class="banner-title">
          <div class="banner-title-text">
            <h3 class="banner-title-line1">Report Crime</h3>
            <h3 class="banner-title-line2">Anonymously</h3>
          </div>
        </div>
        
        <!-- Phone Info Cards -->
        <div class="banner-phone-info">
          <div class="banner-phone-card">
            <div class="banner-copy-button-wrapper">
              <button class="banner-copy-button" data-phone="204-786-8477">
                <img class="banner-copy-icon" alt="Copy" src="assets/icons/copy_icon.svg">
                <span class="banner-copy-text">Copy</span>
              </button>
            </div>
            <div class="banner-card-content">
              <div class="banner-card-header">Local Tips</div>
              <div class="banner-card-phone">204-786-8477</div>
              <div class="banner-card-description">Call Locally within Winnipeg</div>
            </div>
          </div>
          
          <div class="banner-phone-card">
            <div class="banner-copy-button-wrapper">
              <button class="banner-copy-button" data-phone="1-800-222-8477">
                <img class="banner-copy-icon" alt="Copy" src="assets/icons/copy_icon.svg">
                <span class="banner-copy-text">Copy</span>
              </button>
            </div>
            <div class="banner-card-content">
              <div class="banner-card-header">Toll-Free</div>
              <div class="banner-card-phone">1-800-222-8477</div>
              <div class="banner-card-description">Call from anywhere in Canada</div>
            </div>
          </div>
        </div>
        
        <!-- Submit Tip Button -->
        <div class="banner-tip-submit">
          <button class="banner-tip-button" @click="navigateTo('#submit_tip')" onclick="window.navigateTo('#submit_tip');">
            <span class="banner-tip-button-text">SUBMIT ONLINE TIP</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
