<div class="services-showcase" x-data="servicesShowcase()">
    <!-- Navigation Tabs -->
    <div class="services-tabs" x-ref="tabsContainer">
        <template x-for="(service, index) in services" :key="service.id">
            <div class="service-tab" 
                 :class="{ 'active': currentIndex === index }"
                 @click="selectService(index)">
                <div class="tab-button">
                    <span class="tab-text" x-text="service.title"></span>
                </div>
                <div class="timer-bar" 
                     :class="{ 'active': currentIndex === index }"
                     x-ref="`timer-${index}`"></div>
            </div>
        </template>
    </div>

    <!-- Content Panel -->
    <div class="services-content" 
         @mouseenter="pauseTimer()" 
         @mouseleave="resumeTimer()">
        <div class="content-slider" 
             :style="`transform: translateX(-${currentIndex * 100}%)`">
            <template x-for="(service, index) in services" :key="service.id">
                <div class="service-panel">
                    <div class="service-media">
                        <div class="media-container" x-html="service.media"></div>
                    </div>
                    <div class="service-text">
                        <div class="service-description">
                            <p x-text="service.description"></p>
                        </div>
                        <button class="btn-learn-more">
                            <span class="btn-text" x-text="service.buttonText"></span>
                            <div class="btn-circle">
                                <img src="assets/icons/arrow.svg" alt="Arrow" class="btn-arrow">
                            </div>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
