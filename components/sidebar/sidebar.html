<div class="sidebar-content">
    <div class="sidebar-header">
        <img src="assets/icons/logo.png" alt="Crime Stoppers Logo" class="sidebar-logo">
    </div>
    
    <nav class="sidebar-nav">
        <div class="nav-group">
            <template x-for="page in navigation" :key="page.id">
                <div class="nav-item-wrapper">
                    <!-- Main Navigation Item -->
                    <a 
                        :href="page.path"
                        @click.prevent="navigateTo(page.path)"
                        class="nav-item"
                        :class="{ 'is-selected': currentPage === page.id }"
                    >
                        <div class="nav-icon-container">
                            <img 
                                :src="`assets/icons/${page.icon}`" 
                                :alt="`${page.name} icon`"
                                class="nav-icon"
                                @error="showPlaceholderIcon($event)"
                            >
                        </div>
                        <span class="nav-text" x-text="page.name"></span>
                    </a>
                    
                    <!-- Sub-navigation (Table of Contents) -->
                    <div 
                        x-show="currentPage === page.id && page.sections && page.sections.length > 0"
                        x-transition:enter="transition ease-out duration-200"
                        x-transition:enter-start="opacity-0 transform -translate-y-2"
                        x-transition:enter-end="opacity-100 transform translate-y-0"
                        x-transition:leave="transition ease-in duration-150"
                        x-transition:leave-start="opacity-100 transform translate-y-0"
                        x-transition:leave-end="opacity-0 transform -translate-y-2"
                        class="sub-nav"
                    >
                        <template x-for="section in page.sections" :key="section.id">
                            <a 
                                :href="`#${section.id}`"
                                @click.prevent="scrollToSection(section.id)"
                                class="sub-nav-item"
                                :class="{ 'is-selected': activeSection === section.id }"
                            >
                                <div class="sub-nav-indicator"></div>
                                <span class="sub-nav-text" x-text="section.title"></span>
                            </a>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </nav>
</div>
