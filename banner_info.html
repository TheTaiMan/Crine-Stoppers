<!DOCTYPE html>
<html>
<head>

  	<link rel="stylesheet"  href="./index.css" />

  	<style>
      .report-crime1 {

.anonymously {

}
.report-crime-anonymously-container {
  	flex: 1;
  	position: relative;
  	line-height: 146%;

}
.report-crime {
  	align-self: stretch;

  	display: flex;
  	flex-direction: row;
  	align-items: center;

}
.copy-alt-icon {

}
.copy {

  	justify-content: flex-start;

}
.copy-button-wrapper {
  	align-self: stretch;

  	flex-direction: row;
  	align-items: center;
  	justify-content: flex-end;

}
.header {
  	align-self: stretch;
  	position: relative;

}
.phone {
  	align-self: stretch;

  	font-size: 23px;
  	letter-spacing: -0.02em;
  	line-height: 153%;
}
.description {
  	align-self: stretch;
  	position: relative;
  	font-size: 10px;
  	letter-spacing: -0.02em;
  	line-height: 153%;
}
.content {
  	align-self: stretch;
  	background-color: #f7fafc;
  	display: flex;
  	flex-direction: column;
  	align-items: center;
  	justify-content: center;
  	padding: 0px 0px 10px;
  	gap: 10px;
  	text-align: center;
  	font-size: 15px;
  	color: #09161c;
}
.phone-info-box {
  	flex: 1;
  	border-radius: 16px;
  	background-color: #f7fafc;
  	overflow: hidden;
  	display: flex;
  	flex-direction: column;
  	align-items: center;
  	justify-content: center;
  	min-width: 180px;
  	max-width: 200px;
  	min-height: 132px;
}
.phone-info {
  	align-self: stretch;
  	display: flex;
  	flex-direction: row;
  	align-items: flex-end;
  	justify-content: center;
  	flex-wrap: wrap;
  	align-content: flex-end;
  	gap: 10px;
  	text-align: left;
  	font-size: 10px;
}
.title {
  	flex: 1;
  	position: relative;
  	letter-spacing: -0.02em;
  	line-height: 153%;
  	display: inline-block;
  	height: 44px;
}
.background {
  	width: 100%;
  	border-radius: 18px;
  	background-color: #bf1e2e;
  	height: 70px;
  	display: flex;
  	flex-direction: row;
  	align-items: center;
  	justify-content: center;
  	min-width: 298px;
  	max-width: 414px;
  	min-height: 50px;
  	max-height: 70px;
}
.tip-button {
  	align-self: stretch;
  	display: flex;
  	flex-direction: column;
  	align-items: center;
  	justify-content: center;
  	font-size: 32px;

}
.report-crime-parent {

  	flex: 1;
  	display: flex;
  	flex-direction: column;
  	align-items: center;

  	position: relative;
  	overflow: hidden;
  	flex-shrink: 0;
  	display: flex;
  	flex-direction: column;
  	align-items: flex-start;
  	justify-content: center;
  	text-align: center;
  	font-size: 35px;
  	color: #f7fafc;
  	font-family: Montserrat;
}

body {
  	margin: 0;
  	line-height: normal;
}

              							<div class="copy">Copy</div>
            						</div>
          					</div>
          					<div class="content">
            						<b class="header">Toll-Free</b>
            						<b class="phone">1-800-222-8477</b>
            						<b class="description">Call from anywhere in Canada</b>
          					</div>
        				</div>
      			</div>
      			<div class="tip-button">
        				<div class="background">
          					<b class="title">SUBMIT ONLINE TIP</b>
        				</div>
      			</div>
    		</div>
  	</div>

</html>
