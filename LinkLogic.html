<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine.js Single Page App - History API</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.3/cdn.min.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 2rem 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sidebar h2 {
            padding: 0 2rem 2rem;
            font-size: 1.5rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-section {
            margin-bottom: 2rem;
        }

        .nav-section-title {
            padding: 0 2rem 1rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .nav-list {
            list-style: none;
        }

        .nav-item {
            margin: 0.5rem 0;
        }

        .nav-link {
            display: block;
            padding: 1rem 2rem;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateX(5px);
        }

        .nav-link.active {
            background: linear-gradient(90deg, rgba(52, 152, 219, 0.2), rgba(46, 204, 113, 0.2));
            border-left-color: #3498db;
            color: white;
            font-weight: 600;
        }

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(180deg, #3498db, #2ecc71);
            animation: pulse 2s infinite;
        }

        /* Sub-navigation for articles */
        .sub-nav {
            margin-left: 2rem;
            margin-top: 0.5rem;
            display: none;
        }

        .sub-nav.show {
            display: block;
        }

        .sub-nav-item {
            padding: 0.5rem 1rem;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .sub-nav-item:hover {
            color: white;
            transform: translateX(3px);
        }

        .sub-nav-item.active {
            color: #3498db;
            font-weight: 500;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            overflow-y: auto;
            height: 100vh;
            position: relative;
        }

        .page-content {
            padding: 4rem 3rem;
            min-height: calc(100vh - 8rem);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(240, 248, 255, 0.9));
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header {
            font-size: 3rem;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #2c3e50, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .page-text {
            font-size: 1.1rem;
            color: #444;
            max-width: 800px;
            line-height: 1.8;
        }

        .page-text p {
            margin-bottom: 1.5rem;
        }

        /* Article styles */
        .article-header {
            margin-bottom: 2rem;
        }

        .article-meta {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .article-content {
            max-width: 700px;
            line-height: 1.8;
        }

        .article-content p {
            margin-bottom: 1.5rem;
        }

        /* News grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .news-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(52, 152, 219, 0.1);
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .news-card h3 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .news-card p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .read-more {
            color: #3498db;
            font-weight: 500;
            text-decoration: none;
        }

        .read-more:hover {
            text-decoration: underline;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .feature-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(52, 152, 219, 0.1);
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .feature-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Breadcrumb */
        .breadcrumb {
            background: rgba(52, 152, 219, 0.1);
            padding: 1rem 3rem;
            color: #2c3e50;
            font-weight: 500;
            border-bottom: 1px solid rgba(52, 152, 219, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .breadcrumb a {
            color: #3498db;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb-separator {
            color: #999;
        }

        /* Back button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #3498db;
            text-decoration: none;
            margin-bottom: 2rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .back-button:hover {
            transform: translateX(-3px);
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1001;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Overlay for mobile menu */
        .mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
            display: none;
        }

        .mobile-overlay.show {
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: fixed;
                top: 0;
                transform: translateX(-100%);
                z-index: 1000;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .page-content {
                padding: 3rem 1.5rem;
            }

            .page-header {
                font-size: 2rem;
            }

            .menu-toggle {
                display: block;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 404 page */
        .error-404 {
            text-align: center;
            padding: 4rem 2rem;
        }

        .error-404 h1 {
            font-size: 6rem;
            color: #3498db;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div x-data="spaApp()" x-init="init()">
        <!-- Mobile Menu Toggle -->
        <button class="menu-toggle" @click="toggleMobile()">☰</button>

        <!-- Mobile Overlay -->
        <div class="mobile-overlay" :class="{ 'show': mobileMenuOpen }" @click="mobileMenuOpen = false"></div>

        <!-- Sidebar Navigation -->
        <nav class="sidebar" :class="{ 'open': mobileMenuOpen }">
            <h2>Navigation</h2>
            
            <div class="nav-section">
                <ul class="nav-list">
                    <template x-for="route in routes" :key="route.path">
                        <li class="nav-item">
                            <a class="nav-link" 
                               :class="{ 'active': isActiveRoute(route.path) }"
                               @click="navigate(route.path)"
                               x-text="route.title">
                            </a>
                            <!-- Sub-navigation for news articles -->
                            <div x-show="route.path === '/news' && isActiveRoute('/news')" 
                                 class="sub-nav"
                                 :class="{ 'show': isActiveRoute('/news') }">
                                <template x-for="article in newsArticles" :key="article.slug">
                                    <div class="sub-nav-item"
                                         :class="{ 'active': currentPath === '/news/' + article.slug }"
                                         @click.stop="navigate('/news/' + article.slug)"
                                         x-text="'→ ' + article.title">
                                    </div>
                                </template>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Breadcrumb -->
            <div class="breadcrumb" x-show="breadcrumb.length > 0">
                <template x-for="(crumb, index) in breadcrumb" :key="index">
                    <span>
                        <a @click="navigate(crumb.path)" x-text="crumb.title" style="cursor: pointer;"></a>
                        <span x-show="index < breadcrumb.length - 1" class="breadcrumb-separator"> / </span>
                    </span>
                </template>
            </div>

            <!-- Dynamic Page Content -->
            <div class="page-content" x-html="currentContent"></div>
        </main>
    </div>

    <script>
        function spaApp() {
            return {
                currentPath: '/',
                currentContent: '',
                mobileMenuOpen: false,
                breadcrumb: [],
                
                routes: [
                    { path: '/', title: 'Home' },
                    { path: '/about', title: 'About' },
                    { path: '/news', title: 'News' },
                    { path: '/services', title: 'Services' },
                    { path: '/contact', title: 'Contact' }
                ],

                newsArticles: [
                    {
                        slug: 'alpine-js-update',
                        title: 'Alpine.js 3.0 Released',
                        date: 'January 15, 2025',
                        summary: 'The latest version brings exciting new features...',
                        content: `
                            <p>Alpine.js 3.0 has been released with significant improvements to performance and developer experience. This update represents months of community feedback and careful iteration.</p>
                            <p>Key features include:</p>
                            <ul style="margin-left: 2rem; margin-bottom: 1.5rem;">
                                <li>Improved reactivity system with better performance</li>
                                <li>New composable architecture for better code organization</li>
                                <li>Enhanced TypeScript support</li>
                                <li>Smaller bundle size despite new features</li>
                            </ul>
                            <p>The Alpine.js team has focused on maintaining the framework's simplicity while adding powerful features that developers have been requesting.</p>
                        `
                    },
                    {
                        slug: 'web-components-2025',
                        title: 'Web Components in 2025',
                        date: 'January 10, 2025',
                        summary: 'How web components are shaping modern development...',
                        content: `
                            <p>Web Components have come a long way since their introduction. In 2025, they're becoming the standard for building reusable UI components across frameworks.</p>
                            <p>Major browsers now have excellent support, and the developer tooling has matured significantly. Companies are increasingly adopting Web Components for their design systems.</p>
                            <p>The interoperability between different frameworks has never been better, thanks to Web Components serving as a common ground.</p>
                        `
                    },
                    {
                        slug: 'spa-best-practices',
                        title: 'SPA Best Practices',
                        date: 'January 5, 2025',
                        summary: 'Modern techniques for building single-page applications...',
                        content: `
                            <p>Building single-page applications requires careful consideration of performance, SEO, and user experience. Here are the best practices for 2025.</p>
                            <p>Performance optimization remains crucial. Lazy loading, code splitting, and proper caching strategies can dramatically improve load times.</p>
                            <p>SEO for SPAs has evolved with better server-side rendering solutions and improved search engine capabilities for JavaScript-heavy sites.</p>
                        `
                    }
                ],

                pageContents: {
                    '/': `
                        <h1 class="page-header">Welcome Home</h1>
                        <div class="page-text">
                            <p>This is a modern single-page application built with Alpine.js using the History API for clean, SEO-friendly URLs.</p>
                            <p>Navigate through the menu to see how the URLs change without page reloads. You can bookmark any page, share links, and use the browser's back/forward buttons!</p>
                            
                            <div class="feature-grid">
                                <div class="feature-card">
                                    <div class="feature-icon">🚀</div>
                                    <h3>History API Routing</h3>
                                    <p>Clean URLs without hash symbols, just like traditional websites but with SPA speed.</p>
                                </div>
                                <div class="feature-card">
                                    <div class="feature-icon">📱</div>
                                    <h3>Nested Routes</h3>
                                    <p>Support for nested routes like /news/article-name for complex applications.</p>
                                </div>
                                <div class="feature-card">
                                    <div class="feature-icon">🎯</div>
                                    <h3>SEO Friendly</h3>
                                    <p>Clean URLs that search engines can crawl and index properly.</p>
                                </div>
                            </div>
                        </div>
                    `,
                    '/about': `
                        <h1 class="page-header">About This App</h1>
                        <div class="page-text">
                            <p>This application demonstrates how to build a modern single-page application with proper routing using the History API.</p>
                            <p>Unlike hash-based routing, this approach provides clean URLs that look and behave like traditional multi-page websites while maintaining the speed and smoothness of a single-page app.</p>
                            
                            <div class="feature-grid">
                                <div class="feature-card">
                                    <div class="feature-icon">💡</div>
                                    <h3>Why History API?</h3>
                                    <p>Provides a better user experience with clean, shareable URLs that work with browser navigation.</p>
                                </div>
                                <div class="feature-card">
                                    <div class="feature-icon">⚡</div>
                                    <h3>Performance</h3>
                                    <p>All the benefits of a SPA - instant navigation, no page reloads, smooth transitions.</p>
                                </div>
                            </div>
                            
                            <p><strong>Note:</strong> This requires server configuration to handle all routes. For production, configure your server to serve index.html for all routes.</p>
                        </div>
                    `,
                    '/news': `
                        <h1 class="page-header">Latest News</h1>
                        <div class="page-text">
                            <p>Stay updated with the latest in web development. Click on any article to read more!</p>
                            
                            <div class="news-grid" id="news-grid">
                                <!-- News cards will be inserted here -->
                            </div>
                        </div>
                    `,
                    '/services': `
                        <h1 class="page-header">Our Services</h1>
                        <div class="page-text">
                            <p>We offer comprehensive web development services using modern technologies and best practices.</p>
                            
                            <div class="feature-grid">
                                <div class="feature-card">
                                    <div class="feature-icon">💻</div>
                                    <h3>Web Development</h3>
                                    <p>Custom web applications built with modern frameworks and clean architecture.</p>
                                </div>
                                <div class="feature-card">
                                    <div class="feature-icon">🎨</div>
                                    <h3>UI/UX Design</h3>
                                    <p>Beautiful, intuitive interfaces that users love to interact with.</p>
                                </div>
                                <div class="feature-card">
                                    <div class="feature-icon">📊</div>
                                    <h3>Performance Optimization</h3>
                                    <p>Make your applications lightning fast with our optimization techniques.</p>
                                </div>
                                <div class="feature-card">
                                    <div class="feature-icon">🔍</div>
                                    <h3>SEO Services</h3>
                                    <p>Ensure your SPA is discoverable with proper SEO implementation.</p>
                                </div>
                            </div>
                        </div>
                    `,
                    '/contact': `
                        <h1 class="page-header">Get In Touch</h1>
                        <div class="page-text">
                            <p>We'd love to hear from you! Whether you have a project in mind or just want to say hello.</p>
                            
                            <div class="feature-grid">
                                <div class="feature-card">
                                    <div class="feature-icon">📧</div>
                                    <h3>Email Us</h3>
                                    <p>Send us a message at hello@example.com</p>
                                </div>
                                <div class="feature-card">
                                    <div class="feature-icon">📞</div>
                                    <h3>Call Us</h3>
                                    <p>+1 (555) 123-4567</p>
                                </div>
                                <div class="feature-card">
                                    <div class="feature-icon">📍</div>
                                    <h3>Visit Us</h3>
                                    <p>123 Web Street, Digital City, DC 12345</p>
                                </div>
                            </div>
                        </div>
                    `
                },

                init() {
                    // Handle initial route
                    this.handleRoute();
                    
                    // Listen for browser navigation (back/forward buttons)
                    window.addEventListener('popstate', () => {
                        this.handleRoute();
                    });

                    // Handle direct links
                    document.addEventListener('click', (e) => {
                        // Check if it's a link
                        const link = e.target.closest('a');
                        if (link && link.href && link.href.startsWith(window.location.origin)) {
                            e.preventDefault();
                            const path = link.href.replace(window.location.origin, '');
                            this.navigate(path);
                        }
                    });
                },

                navigate(path) {
                    // Update URL without page reload
                    window.history.pushState({}, '', path);
                    this.handleRoute();
                    this.mobileMenuOpen = false;
                },

                handleRoute() {
                    this.currentPath = window.location.pathname;
                    this.updateBreadcrumb();
                    
                    // Handle root path
                    if (this.currentPath === '/') {
                        this.currentContent = this.pageContents['/'];
                        return;
                    }

                    // Handle news articles
                    if (this.currentPath.startsWith('/news/')) {
                        const slug = this.currentPath.replace('/news/', '');
                        const article = this.newsArticles.find(a => a.slug === slug);
                        
                        if (article) {
                            this.currentContent = this.renderArticle(article);
                        } else {
                            this.currentContent = this.render404();
                        }
                        return;
                    }

                    // Handle other pages
                    if (this.pageContents[this.currentPath]) {
                        this.currentContent = this.pageContents[this.currentPath];
                        
                        // If it's the news page, render the news cards
                        if (this.currentPath === '/news') {
                            this.$nextTick(() => {
                                this.renderNewsCards();
                            });
                        }
                    } else {
                        this.currentContent = this.render404();
                    }
                },

                renderArticle(article) {
                    return `
                        <a class="back-button" onclick="window.dispatchEvent(new CustomEvent('navigate-back', { detail: '/news' }))">
                            ← Back to News
                        </a>
                        <article class="article-header">
                            <h1 class="page-header">${article.title}</h1>
                            <div class="article-meta">
                                Published on ${article.date}
                            </div>
                        </article>
                        <div class="article-content">
                            ${article.content}
                        </div>
                    `;
                },

                renderNewsCards() {
                    const newsGrid = document.getElementById('news-grid');
                    if (!newsGrid) return;
                    
                    newsGrid.innerHTML = this.newsArticles.map(article => `
                        <div class="news-card" onclick="window.dispatchEvent(new CustomEvent('navigate-to', { detail: '/news/${article.slug}' }))">
                            <h3>${article.title}</h3>
                            <p>${article.summary}</p>
                            <span class="read-more">Read more →</span>
                        </div>
                    `).join('');
                },

                render404() {
                    return `
                        <div class="error-404">
                            <h1>404</h1>
                            <h2>Page Not Found</h2>
                            <p>The page you're looking for doesn't exist.</p>
                            <a class="back-button" onclick="window.dispatchEvent(new CustomEvent('navigate-back', { detail: '/' }))">
                                ← Go Home
                            </a>
                        </div>
                    `;
                },

                updateBreadcrumb() {
                    this.breadcrumb = [];
                    
                    if (this.currentPath === '/') return;
                    
                    // Always add home
                    this.breadcrumb.push({ path: '/', title: 'Home' });
                    
                    // Handle news articles
                    if (this.currentPath.startsWith('/news/')) {
                        this.breadcrumb.push({ path: '/news', title: 'News' });
                        const slug = this.currentPath.replace('/news/', '');
                        const article = this.newsArticles.find(a => a.slug === slug);
                        if (article) {
                            this.breadcrumb.push({ path: this.currentPath, title: article.title });
                        }
                    } else {
                        // Handle other pages
                        const route = this.routes.find(r => r.path === this.currentPath);
                        if (route) {
                            this.breadcrumb.push({ path: route.path, title: route.title });
                        }
                    }
                },

                isActiveRoute(path) {
                    if (path === '/') {
                        return this.currentPath === '/';
                    }
                    return this.currentPath.startsWith(path);
                },

                toggleMobile() {
                    this.mobileMenuOpen = !this.mobileMenuOpen;
                }
            }
        }

        // Listen for custom navigation events
        window.addEventListener('navigate-to', (e) => {
            const app = document.querySelector('[x-data]')._x_dataStack[0];
            app.navigate(e.detail);
        });

        window.addEventListener('navigate-back', (e) => {
            const app = document.querySelector('[x-data]')._x_dataStack[0];
            app.navigate(e.detail);
        });
    </script>
</body>
</html>
