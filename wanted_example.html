<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    .content {
      display: flex;
      flex-direction: column;
      max-width: 1155px;
      align-items: center;
      gap: 10px;
      padding: 0px 0px 20px;
      position: relative;
    }

    .content .police-banner {
      position: relative;
      width: 1155px;
      height: 235px;
    }

    .content .wanted-content {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: fit-content(100%) fit-content(100%);
      height: 367px;
      gap: 20px;
      padding: 5px 0px 0px;
      position: absolute;
      width: 1155px;
      top: 245px;
      left: 0;
    }

    .content .winnipeg-s-most {
      position: relative;
      grid-row: 1 / 2;
      grid-column: 2 / 3;
      width: 566px;
      height: fit-content;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 0px 24px 20px;
      background-color: var(--variable-collection-midnight-navy);
      border-radius: 16px;
      overflow: hidden;
    }

    .content .header {
      display: flex;
      height: 44px;
      align-items: center;
      gap: 10px;
      position: relative;
      align-self: stretch;
      width: 100%;
    }

    .content .text-wrapper {
      position: relative;
      flex: 1;
      margin-top: -1px;
      font-family: 'Montserrat-Bold', Helvetica;
      font-weight: 700;
      color: var(--variable-collection-cool-white);
      font-size: 30px;
      letter-spacing: 0;
      line-height: 43.8px;
    }

    .content .info-button {
      display: flex;
      width: 231px;
      max-height: 59px;
      height: 59px;
      align-items: center;
      gap: 12px;
      padding: 0px 6px 0px 12px;
      position: relative;
      background-color: var(--variable-collection-storm-blue);
      border-radius: 20px;
    }

    .content .frame {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      flex: 1;
      align-self: stretch;
      flex-grow: 1;
    }

    .content .learn-more {
      position: relative;
      flex: 1;
      font-family: 'Montserrat-Bold', Helvetica;
      font-weight: 700;
      color: var(--variable-collection-cool-white);
      font-size: 20px;
      text-align: center;
      letter-spacing: 0;
      line-height: 29.2px;
    }

    .content .arrow {
      position: relative;
      width: 47px;
      height: 47px;
      background-color: var(--variable-collection-cool-white);
      border-radius: 23.5px;
    }

    .content .polygon {
      position: absolute;
      width: 24px;
      height: 27px;
      top: 10px;
      left: 13px;
    }

    .content .manitoba-s-most {
      position: relative;
      grid-row: 2 / 3;
      grid-column: 1 / 2;
      width: 566px;
      height: fit-content;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 0px 24px 20px;
      background-color: var(--variable-collection-midnight-navy);
      border-radius: 16px;
      overflow: hidden;
    }

    .content .words {
      position: relative;
      grid-row: 1 / 2;
      grid-column: 1 / 2;
      width: fit-content;
      height: fit-content;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 10px;
    }

    .content .header-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      align-self: stretch;
      width: 100%;
      flex: 0 0 auto;
    }

    .content .div {
      position: relative;
      flex: 1;
      margin-top: -1px;
      font-family: 'Montserrat-Black', Helvetica;
      font-weight: 900;
      color: var(--variable-collection-midnight-navy);
      font-size: 40px;
      letter-spacing: 0;
      line-height: 58.4px;
    }

    .content .paragraph-content {
      display: flex;
      max-width: 500px;
      width: 500px;
      align-items: flex-start;
      gap: 10px;
      position: relative;
      flex: 0 0 auto;
    }

    .content .line {
      position: relative;
      align-self: stretch;
      width: 10px;
      background-color: #09161c;
      border-radius: 13px;
    }

    .content .paragraph-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      position: relative;
      flex: 1;
      flex-grow: 1;
    }

    .content .paragraph {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      position: relative;
      align-self: stretch;
      width: 100%;
      flex: 0 0 auto;
    }

    .content .lorem-ipsum-dolor {
      position: relative;
      width: 429px;
      margin-top: -1px;
      font-family: 'Hind-Medium', Helvetica;
      font-weight: 500;
      color: var(--variable-collection-midnight-navy);
      font-size: 18px;
      letter-spacing: -0.36px;
      line-height: 27.5px;
    }
  </style>
  <body>
    <div class="content">
      <img class="police-banner" src="img/police-banner.png" />
      <div class="wanted-content">
        <div class="winnipeg-s-most">
          <div class="header">
            <div class="text-wrapper">Winnipeg’s Most Wanted</div>
          </div>
          <div class="info-button">
            <div class="frame"><div class="learn-more">WANTED LIST</div></div>
            <div class="arrow"><img class="polygon" src="img/image.svg" /></div>
          </div>
        </div>
        <div class="manitoba-s-most">
          <div class="header">
            <div class="text-wrapper">Manitoba&#39;s Most Wanted</div>
          </div>
          <div class="info-button">
            <div class="frame"><div class="learn-more">WANTED LIST</div></div>
            <div class="arrow">
              <img class="polygon" src="img/polygon-5.svg" />
            </div>
          </div>
        </div>
        <div class="words">
          <div class="header-wrapper"><div class="div">WANTED</div></div>
          <div class="paragraph-content">
            <div class="line"></div>
            <div class="paragraph-wrapper">
              <div class="paragraph">
                <p class="lorem-ipsum-dolor">
                  The buttons on this page will take you to the Winnipeg Police
                  Service website. To provide tips, contact Winnipeg Crime
                  Stoppers.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
