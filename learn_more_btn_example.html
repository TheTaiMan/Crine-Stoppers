<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./index.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap"
    />

    <style>
      .learn-more {
        flex: 1;
        position: relative;
        line-height: 146%;
        text-transform: uppercase;
      }
      .learn-more-wrapper {
        align-self: stretch;
        flex: 1;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
      }
      .arrow-icon {
        width: 47px;
        position: relative;
        height: 47px;
      }
      .mobilefalse {
        position: absolute;
        top: 20px;
        left: 20px;
        border-radius: 20px;
        background-color: #6f8ea7;
        width: 220px;
        height: 59px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        padding: 0px 6px 0px 12px;
        box-sizing: border-box;
        gap: 12px;
        min-width: 220px;
        max-height: 59px;
      }
      .arrow-icon1 {
        width: 40px;
        position: relative;
        height: 40px;
      }
      .mobiletrue {
        position: absolute;
        top: 122px;
        left: 20px;
        border-radius: 15px;
        background-color: #6f8ea7;
        width: 190px;
        height: 52px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        padding: 6px 6px 6px 10px;
        box-sizing: border-box;
        gap: 12px;
        max-width: 190px;
        max-height: 52px;
        font-size: 17px;
      }
      .info-button {
        width: 100%;
        position: relative;
        border-radius: 5px;
        border: 1px dashed #8a38f5;
        box-sizing: border-box;
        height: 201px;
        overflow: hidden;
        text-align: center;
        font-size: 20px;
        color: #f7fafc;
        font-family: Montserrat;
      }
    </style>
  </head>
  <body>
    <div class="info-button">
      <div class="mobilefalse">
        <div class="learn-more-wrapper">
          <b class="learn-more">Learn More</b>
        </div>
        <img class="arrow-icon" alt="" src="Arrow.svg" />
      </div>
      <div class="mobiletrue">
        <div class="learn-more-wrapper">
          <b class="learn-more">Learn More</b>
        </div>
        <img class="arrow-icon1" alt="" src="Arrow.svg" />
      </div>
    </div>
  </body>
</html>
