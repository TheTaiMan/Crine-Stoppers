<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Stoppers Winnipeg</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="components/sidebar/sidebar.css">
    <link rel="stylesheet" href="components/footer/footer.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- App Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="components/sidebar/sidebar.js"></script>
</head>
<body x-data="{ ...app(), ...sidebar() }" x-init="init(); checkMobile(); initSidebar()" class="min-h-screen">
    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside 
            :class="{ 'sidebar-hidden': !isOpen }"
            class="sidebar"
            id="sidebar"
        >
            <!-- Include sidebar content -->
            <div x-html="sidebarContent"></div>
        </aside>
        
        <!-- Mobile Menu Toggle -->
        <button 
            @click="toggle()"
            class="mobile-menu-toggle"
            :class="{ 'hidden': !isMobile }"
        >
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
        
        <!-- Main Content Area -->
        <main class="main-content flex-grow">
            <!-- Dynamic Content Container -->
            <div id="content-area" class="content-container">
                <div x-html="pageContent" class="page-content"></div>
            </div>
            
            <!-- Footer -->
            <footer x-html="footerContent" class="footer-container"></footer>
        </main>
    </div>
    
    <!-- Loading Indicator -->
    <div x-show="isLoading" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
</body>
</html>
