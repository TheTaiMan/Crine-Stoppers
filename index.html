<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Stoppers Winnipeg</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="components/sidebar/sidebar.css">
    <link rel="stylesheet" href="components/footer/footer.css">
    <link rel="stylesheet" href="components/banner/banner.css">
    <link rel="stylesheet" href="pages/home/home.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- App Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="components/sidebar/sidebar.js"></script>
    <script src="components/banner/banner.js"></script>
</head>
<body x-data="{ ...app(), ...sidebar() }" x-init="init(); checkMobile(); initSidebar()" class="min-h-screen" :class="{ 'mobile-nav-open': mobileNavOpen }">
    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside 
            :class="{ 'sidebar-hidden': !isOpen }"
            class="sidebar"
            id="sidebar"
        >
            <!-- Include sidebar content -->
            <div x-html="sidebarContent"></div>
        </aside>
        
        
        <!-- Main Content Area -->
        <main class="main-content flex-grow">
            <!-- Dynamic Content Container -->
            <div id="content-area" class="content-container" style="position: relative;">
                <div x-html="pageContent" class="page-content"></div>
                
                <!-- Content Loading Indicator -->
                <div x-show="isLoading" class="content-loading-overlay">
                    <div class="loading-spinner"></div>
                </div>
            </div>
            
            <!-- Footer -->
            <footer x-html="footerContent" class="footer-container"></footer>
        </main>
    </div>
    
    <!-- Mobile Navbar (Bottom Bar) -->
    <div 
        class="mobile-navbar"
        :class="{ 'expanded': mobileNavOpen }"
    >
        <!-- Expanded content (only visible when mobileNavOpen is true) -->
        <div 
            class="mobile-nav-content"
            x-show="mobileNavOpen"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 transform translate-y-4"
            x-transition:enter-end="opacity-100 transform translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 transform translate-y-0"
            x-transition:leave-end="opacity-0 transform translate-y-4"
        >
            <!-- Mobile Sidebar Header with Logo (only visible when expanded) -->
            <div class="mobile-sidebar-header">
                <img src="assets/icons/logo.png" alt="Crime Stoppers Logo" class="mobile-sidebar-logo">
            </div>
            
            <!-- Mobile Navigation -->
            <nav class="mobile-sidebar-nav" x-data="{ openSubMenuId: null }">
                <div class="mobile-nav-group">
                    <template x-for="page in navigation" :key="page.id">
                        <div class="mobile-nav-item-wrapper">
                            <!-- Main Navigation Item with Arrow -->
                            <div class="mobile-nav-item-container">
                                <a 
                                    :href="page.path"
                                    @click.prevent="
                                        if (page.sections && page.sections.length > 0) {
                                            openSubMenuId = page.id;
                                        }
                                        navigateTo(page.path); 
                                        closeMobileNav();
                                    "
                                    class="mobile-nav-item"
                                    :class="{ 'is-selected': currentPage === page.id }"
                                >
                                    <div class="mobile-nav-icon-container">
                                        <img 
                                            :src="`assets/icons/${page.icon}`" 
                                            :alt="`${page.name} icon`"
                                            class="mobile-nav-icon"
                                            @error="showPlaceholderIcon($event)"
                                        >
                                    </div>
                                    <span class="mobile-nav-text" x-text="page.name"></span>
                                </a>
                                
                                <!-- Expand/Collapse Arrow Button (only show if page has sections) -->
                                <button 
                                    x-show="page.sections && page.sections.length > 0"
                                    @click="openSubMenuId = (openSubMenuId === page.id) ? null : page.id"
                                    class="mobile-nav-arrow-btn"
                                    :class="{ 'expanded': openSubMenuId === page.id }"
                                    :title="openSubMenuId === page.id ? 'Collapse ' + page.name : 'Expand ' + page.name"
                                >
                                    <svg class="mobile-nav-arrow" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                                    </svg>
                                </button>
                            </div>
                            
                            <!-- Mobile Sub-navigation -->
                            <div 
                                x-show="openSubMenuId === page.id && page.sections && page.sections.length > 0"
                                x-transition:enter="transition ease-out duration-150"
                                x-transition:enter-start="opacity-0 transform -translate-y-2"
                                x-transition:enter-end="opacity-100 transform translate-y-0"
                                x-transition:leave="transition ease-in duration-50"
                                x-transition:leave-start="opacity-100 transform translate-y-0"
                                x-transition:leave-end="opacity-0 transform -translate-y-2"
                                class="mobile-sub-nav"
                            >
                                <template x-for="section in page.sections" :key="section.id">
                                    <a 
                                        :href="`#${section.id}`"
                                        @click.prevent="
                                            closeMobileNav();
                                            if (currentPage === page.id) {
                                                scrollToSection(section.id);
                                            } else {
                                                navigateTo(page.path).then(() => {
                                                    setTimeout(() => scrollToSection(section.id), 200);
                                                });
                                            }
                                        "
                                        class="mobile-sub-nav-item"
                                        :class="{ 'is-selected': activeSection === section.id }"
                                    >
                                        <div class="mobile-sub-nav-indicator"></div>
                                        <span class="mobile-sub-nav-text" x-text="section.title"></span>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </nav>
            
            <!-- Mobile Donate Button -->
            <div class="mobile-nav-buttons">
                <div class="mobile-donate-button">
                    <button class="mobile-donate-button-bg" onclick="navigateTo('/donate')">
                        <span class="mobile-donate-button-text">DONATE</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Bottom header with logo (only visible when collapsed) and hamburger -->
        <div class="mobile-navbar-bottom-header">
            <div class="mobile-navbar-logo" x-show="!mobileNavOpen">
                <img src="assets/icons/logo.png" alt="Crime Stoppers Logo">
            </div>
            <button 
                @click="toggleMobileNav()"
                class="mobile-menu-toggle mobile-menu-toggle-right"
                :class="{ 'menu-open': mobileNavOpen }"
            >
                <img class="menu-icon" :src="mobileNavOpen ? 'assets/icons/cross_icon.svg' : 'assets/icons/hamburger_icon.svg'" alt="Menu">
            </button>
        </div>
    </div>
</body>
</html>
