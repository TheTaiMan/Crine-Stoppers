<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./index.css" />

    <style>
      .crime-stoppers-logo {
        width: 170px;
        position: relative;
        max-height: 100%;
        object-fit: cover;
      }
      .logo {
        height: 58px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
      }
      .menu-icon {
        width: 45px;
        position: relative;
        height: 45px;
      }
      .menu-button {
        width: 55px;
        border-radius: 17px;
        background-color: #b8d9b4;
        height: 55px;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-sizing: border-box;
      }
      .mobiletrue-closedtrue {
        width: 100%;
        position: relative;
        background-color: #09161c;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 8px;
        box-sizing: border-box;
        gap: 0px;
      }
      
    </style>
  </head>
  <body>
    <div class="mobiletrue-closedtrue">
      <div class="logo">
        <img class="crime-stoppers-logo" alt="" src="Crime Stoppers Logo.png" />
      </div>
      <div class="menu-button">
        <img class="menu-icon" alt="" src="Menu.svg" />
      </div>
    </div>
  </body>
</html>
