<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    .faq-questions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      height: 174px;
      gap: 20px;
      position: relative;
    }

    .faq-questions .faq-question {
      position: relative;
      grid-row: 1 / 2;
      grid-column: 2 / 3;
      width: 100%;
      height: fit-content;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 12px 12px 20px;
      background-color: var(--variable-collection-cool-white);
      border-radius: 16px;
      overflow: hidden;
      border: 5px solid;
      border-color: var(--variable-collection-midnight-navy);
    }

    .faq-questions .title {
      display: flex;
      width: 536px;
      align-items: center;
      justify-content: space-between;
      position: relative;
      flex: 0 0 auto;
      margin-right: -0.5px;
    }

    .faq-questions .header {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      flex: 1;
      flex-grow: 1;
    }

    .faq-questions .text-wrapper {
      position: relative;
      flex: 1;
      margin-top: -1px;
      font-family: 'Montserrat-Bold', Helvetica;
      font-weight: 700;
      color: var(--variable-collection-midnight-navy);
      font-size: 30px;
      letter-spacing: 0;
      line-height: 43.8px;
    }

    .faq-questions .plug-button {
      position: relative;
      width: 53px;
      height: 53px;
    }

    .faq-questions .title-wrapper {
      grid-row: 1 / 2;
      grid-column: 1 / 2;
      position: relative;
      width: 100%;
      height: fit-content;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 12px 12px 20px;
      background-color: var(--variable-collection-cool-white);
      border-radius: 16px;
      overflow: hidden;
      border: 5px solid;
      border-color: var(--variable-collection-midnight-navy);
    }

    .faq-questions .div-wrapper {
      grid-row: 2 / 3;
      grid-column: 1 / 2;
      position: relative;
      width: 100%;
      height: fit-content;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 12px 12px 20px;
      background-color: var(--variable-collection-cool-white);
      border-radius: 16px;
      overflow: hidden;
      border: 5px solid;
      border-color: var(--variable-collection-midnight-navy);
    }

    .faq-questions .div {
      grid-row: 2 / 3;
      grid-column: 2 / 3;
      position: relative;
      width: 100%;
      height: fit-content;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 12px 12px 20px;
      background-color: var(--variable-collection-cool-white);
      border-radius: 16px;
      overflow: hidden;
      border: 5px solid;
      border-color: var(--variable-collection-midnight-navy);
    }
  </style>
  <body>
    <div class="faq-questions">
      <div class="faq-question">
        <div class="title">
          <div class="header">
            <p class="text-wrapper">Be A Part Of The Success</p>
          </div>
          <img class="plug-button" src="img/plug-button.png" />
        </div>
      </div>
      <div class="title-wrapper">
        <div class="title">
          <div class="header">
            <div class="text-wrapper">How Can You Help?</div>
          </div>
          <img class="plug-button" src="img/plug-button-3.png" />
        </div>
      </div>
      <div class="div-wrapper">
        <div class="title">
          <div class="header">
            <div class="text-wrapper">How Are We Funded?</div>
          </div>
          <img class="plug-button" src="img/image.png" />
        </div>
      </div>
      <div class="div">
        <div class="title">
          <div class="header">
            <div class="text-wrapper">Who Runs Crime Stoppers?</div>
          </div>
          <img class="plug-button" src="img/plug-button-2.png" />
        </div>
      </div>
    </div>
  </body>
</html>
